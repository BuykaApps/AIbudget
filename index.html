function budgets(){let arr=[...S.budgets].sort((a,b)=>(a.date||'').localeCompare(b.date||''));return `<div class="top"><div><div class="eyebrow">BUDGET CONTROL</div><h1>Төсөв ба хэтрэлт</h1><p>Төлөвлөсөн зардал бүрт бодит зарлагыг холбож хэтэрсэн эсэхийг хянана.</p></div><div class="topright"><button class="btn primary" onclick="edit('budgets')">＋ Төсөв нэмэх</button></div></div><div class="grid stats"><div class="stat"><div class="stathead">Нийт төсөв <span class="staticon">▦</span></div><div class="statvalue">${money(sum(arr,'amount'))}</div></div><div class="stat"><div class="stathead">Холбосон бодит зарлага <span class="staticon">↘</span></div><div class="statvalue">${money(sum(arr.map(x=>({v:sum(S.expenses.filter(e=>e.budgetId===x.id),'amount')})),'v'))}</div></div><div class="stat"><div class="stathead">Хэтэрсэн төсөв <span class="staticon">!</span></div><div class="statvalue bad">${arr.filter(x=>sum(S.expenses.filter(e=>e.budgetId===x.id),'amount')>(+x.amount||0)).length}</div></div><div class="stat"><div class="stathead">Төлөвлөгөөний мөр <span class="staticon">≡</span></div><div class="statvalue">${arr.length}</div></div></div><div class="panel">${arr.length?arr.map(x=>{let sp=sum(S.expenses.filter(e=>e.budgetId===x.id),'amount'),dif=sp-(+x.amount||0),pct=x.amount?Math.min(100,sp/x.amount*100):0;return `<div class="lineitem"><div class="itemicon">${esc((x.cat||'Б')[0])}</div><div class="itembody"><div class="split"><b>${esc(x.name)}</b><span class="mini">${fmtDate(x.date)}</span></div><small>${money(sp)} бодит / ${money(x.amount)} төлөвлөсөн</small><div class="progress"><i class="${dif>0?'over':''}" style="width:${pct}%"></i></div><small class="${dif>0?'bad':'good'}">${dif>0?'Хэтэрсэн '+money(dif):'Үлдсэн '+money(-dif)}</small></div><div style="display:flex;gap:5px"><button class="btn" onclick="edit('budgets','${x.id}')">Засах</button><button class="btn danger" onclick="del('budgets','${x.id}')">✕</button></div></div>`}).join(''):`<div class="empty">Төсөвлөсөн зардал алга.</div>`}</div><div class="notice warnbox">Зарлагаа оруулахдаа “Холбогдох төлөвлөсөн зардал” талбараас зөв төлөвлөгөөг сонгоорой. Жишээ нь 1,000,000₮ төлөвлөсөн зүйлд бодитоор 1,500,000₮ зарцуулбал 500,000₮ хэтрэлт гарна.</div>`}
function settings(){let op=opening()||{},b=bal()||{},sav=savingsBal()||{},calc=actualBalance(today),manual=b.amount,delta=manual==null||calc==null?null:(+manual-(+calc));return `<div class="top"><div><div class="eyebrow">ACCOUNT SETUP</div><h1>Данс ба үлдэгдэл</h1><p>Хоёр дансны үлдэгдлийг тусад нь оруулж, зээлийн төлөлтийн хүрэлцээг тооцно.</p></div></div><div class="grid twocol"><section class="panel"><div class="panelhead"><div><h2>1. Эхний үлдэгдэл</h2><div class="sub">Тооцоолол эхэлсэн өдөр гүйлгээний дансанд байсан мөнгө.</div></div>${statusTag(op.id?'Бүртгэсэн':'Шаардлагатай',op.id?'green':'amber')}</div><div style="font-size:28px;font-weight:850">${money(op.amount||0)}</div><div class="sub">Огноо: ${fmtDate(op.date)}</div><button class="btn primary" style="margin-top:14px" onclick="edit('balance','opening')">${op.id?'Засах':'＋ Эхний үлдэгдэл оруулах'}</button></section><section class="panel"><div class="panelhead"><div><h2>2. Гүйлгээний данс</h2><div class="sub">Өдөр тутмын орлого, зарлага гардаг банкны данс.</div></div></div><div style="font-size:28px;font-weight:850">${money(calc||0)}</div><div class="sub">Банкны апп дээрх бодит үлдэгдэл: ${money(manual||0)}</div>${delta===null?`<div class="notice warnbox">Банкны апп дээрх одоогийн дүнг оруулж тулгана уу.</div>`:delta===0?`<div class="notice goodbox">✓ Тооцоолол бодит үлдэгдэлтэй таарч байна.</div>`:`<div class="notice ${Math.abs(delta)<1000?'goodbox':'badbox'}">${delta>0?'Банкны дүн тооцооллоос '+money(delta)+'-өөр их.':'Банкны дүн тооцооллоос '+money(-delta)+'-өөр бага.'} Орлого, зарлага орхигдсон эсэхийг шалгана уу.</div>`}<button class="btn primary" onclick="edit('balance','bal')">Бодит үлдэгдэл оруулах / засах</button></section></div><section class="panel"><div class="panelhead"><div><h2>3. Хадгаламжийн данс</h2><div class="sub">Зээл төлөхдөө ашиглаж болох хоёр дахь банкны данс.</div></div></div><div style="font-size:28px;font-weight:850">${money(sav.amount||0)}</div><div class="sub">Зээл төлөхөөр хадгаламжийн дансыг сонгосон үед энэ үлдэгдэлтэй харьцуулж дутагдлыг тооцно.</div><button class="btn primary" style="margin-top:12px" onclick="edit('balance','sav')">Хадгаламжийн үлдэгдэл оруулах / засах</button></section><div class="panel"><div class="panelhead"><div><h2>Тооцооллын дүрэм</h2><div class="sub">Бүх тооцоолол дараах дарааллаар гарна.</div></div></div><div class="lineitem"><div class="itemicon">1</div><div class="itembody"><b>Гүйлгээний дансны одоогийн дүн</b><small>Эхний үлдэгдэл + орсон орлого − бодит зарлага.</small></div></div><div class="lineitem"><div class="itemicon">2</div><div class="itembody"><b>Зээл тус бүрийн төлөх данс</b><small>Зээл бүр дээр “Гүйлгээний данс” эсвэл “Хадгаламжийн данс” сонгоно. Зээл бүртгэх нь өөрөө үлдэгдлээс мөнгө хасахгүй.</small></div></div><div class="lineitem"><div class="itemicon">3</div><div class="itembody"><b>Хадгаламж хүрэлцэхгүй бол</b><small>Хадгаламжаас төлөх зээлийн нийлбэр − хадгаламжийн үлдэгдэл = гүйлгээний данснаас нөхөх дүн.</small></div></div><div class="lineitem"><div class="itemicon">4</div><div class="itembody"><b>Бодитоор төлсөн үед</b><small>Гүйлгээ хэсэгт бодит зарлага болгон оруулсны дараа гүйлгээний дансны тооцоолсон үлдэгдэл буурна. Төлсөн гэж тэмдэглэх нь бодит гүйлгээний оронд ашиглагдахгүй.</small></div></div></div><div class="panel"><div class="panelhead"><div><h2>Нэвтрэлт</h2><div class="sub">Холбогдсон серверийн тохиргоо</div></div></div><div class="sub" style="overflow-wrap:anywhere">${API?esc(API):'Apps Script URL оруулаагүй байна.'}</div><div class="formactions"><button class="btn" onclick="localStorage.removeItem('sess');localStorage.removeItem('cacheS');TOK='';render()">Гарах</button><button class="btn danger" onclick="if(confirm('Энэ браузер дээр хадгалсан API URL-г арилгах уу?')){localStorage.removeItem('api');API='';render()}">API URL арилгах</button></div></div>`}
function ai(){let questions=['Одоогийн мөнгөнөөс хэдийг зарцуулж болох вэ?','Ирэх 30 хоногийн зээлээ тооцоолж өг','Төсөв хэтэрсэн зүйлсийг дүгнэ'];return `<div class="top"><div><div class="eyebrow">SMART MONEY ASSISTANT</div><h1>AI санхүүгийн туслах</h1><p>Бүртгэсэн орлого, зарлага, төлөвлөгөө болон зээлийн хуваарь дээр үндэслэн асуулт асуугаарай.</p></div></div><div class="panel"><div id="msgs" style="min-height:240px;max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:10px">${chat.map(m=>`<div style="align-self:${m.role==='user'?'flex-end':'flex-start'};max-width:88%;padding:12px 14px;border-radius:14px;background:${m.role==='user'?'#eeeaff':'#f7f6fb'};white-space:pre-wrap">${esc(m.text)}</div>`).join('')||'<div class="empty">Жишээ асуултаас сонгох эсвэл доор өөрийн асуултаа бичээрэй.</div>'}</div><div class="pillrow" style="margin:14px 0">${questions.map(q=>`<button class="pill" onclick="askAI('${esc(q)}')">${esc(q)}</button>`).join('')}</div><div class="split"><input id="aiq" style="flex:1;border:1px solid var(--line);border-radius:11px;padding:12px" placeholder="Жишээ: 500,000₮-ийн зүйл авч болох уу?" onkeydown="if(event.key==='Enter')askAI()"><button class="btn primary" onclick="askAI()">Илгээх ↗</button></div></div>`}
function aiContext(){let p=plannedBalance(add(today,60)),over=S.budgets.map(x=>({name:x.name,plan:x.amount,actual:sum(S.expenses.filter(e=>e.budgetId===x.id),'amount')})).filter(x=>x.actual>x.plan);return {today,opening:opening(),calculated_balance:actualBalance(today),manual_bank_balance:bal(),next_60_days:p,loans:loanOccurrences(today,add(today,60)).map(x=>({name:x.name,date:x.date,amount:x.amount,type:kindName(x.kind)})),planned_expenses:S.budgets.map(x=>({name:x.name,date:x.date,amount:x.amount})),budget_overruns:over,actual_expenses:S.expenses.slice(-30),income:S.income.slice(-20)}}
async function askAI(q){q=q||$('#aiq')?.value.trim();if(!q)return;chat.push({role:'user',text:q},{role:'assistant',text:'Хариу боловсруулж байна…'});render();try{let r=await post({a:'ai',q,ctx:aiContext(),hist:chat.slice(-8,-2).map(x=>({role:x.role==='user'?'user':'assistant',content:x.text}))});chat[chat.length-1].text=r.error?'Алдаа: '+r.error:(r.text||'Хариу ирсэнгүй.');}catch(e){chat[chat.length-1].text='AI холболтод алдаа гарлаа: '+e}render()}
function isDone(x){return x.done==='1'||x.done===1||x.done===true}
function remOf(x){return Math.max(0,(+x.amount||0)-sum(S.expenses.filter(e=>e.budgetId===x.id),'amount'))}
function cashNow(){let m=bal();if(m&&m.date){let v=+m.amount||0;S.income.filter(x=>x.got&&x.date>m.date&&x.date<=today).forEach(x=>v+=+(x.amt||0));S.expenses.filter(x=>x.date>m.date&&x.date<=today).forEach(x=>v-=+(x.amount||0));return{v,src:'Банкны бодит үлдэгдэл ('+fmtDate(m.date)+') + дараах гүйлгээ'}}return{v:actualBalance(today)||0,src:'Эхний үлдэгдлээс тооцсон'}}

function planner(){let c=cashNow(),fund=loanFunding(today,add(today,45)),avail=c.v-fund.checkingNeed,end=add(today,45),
 items=S.budgets.filter(x=>x.date<=end&&!isDone(x)&&remOf(x)>0).sort((a,b)=>(a.prio==='can')-(b.prio==='can')||(a.date||'').localeCompare(b.date||'')),
 run=avail,rows=items.map(x=>{let r=remOf(x),ok=r<=run;if(ok)run-=r;return{x,r,ok,left:run}}),total=rows.reduce((a,o)=>a+o.r,0),gap=avail-total,post=rows.filter(o=>!o.ok),
 unpl=sum(S.expenses.filter(e=>!e.budgetId&&e.date>(opening()?.date||'')),'amount');
 return `<div class="panel"><div class="panelhead"><div><h2>Төлөвлөсөн зардлаа гаргаж болох уу?</h2><div class="sub">${c.src}</div></div>${statusTag(gap>=0?'Бүгд хүрнэ':post.length+' зүйл хойшлуулна',gap>=0?'green':'red')}</div>
 <div class="grid stats"><div class="stat click" onclick="drill('chk')"><div class="stathead">Одоо үлдсэн мөнгө</div><div class="statvalue">${money(c.v)}</div><div class="statfoot">Дарж задлах</div></div>
 <div class="stat click" onclick="drill('chkloans')"><div class="stathead">Зээлд гүйлгээний данснаас</div><div class="statvalue">${money(fund.checkingNeed)}</div><div class="statfoot">${fund.checkingNeed?'Ирэх 45 хоног':'Зээл хадгаламжаас төлөгдөх тул дарамтгүй'}</div></div>
 <div class="stat click" onclick="drill('plans')"><div class="stathead">Төлөвлөсөн зардлын үлдэгдэл</div><div class="statvalue">${money(total)}</div><div class="statfoot">${rows.length} зүйл</div></div>
 <div class="stat"><div class="stathead">Бүгдийг авбал үлдэх</div><div class="statvalue ${gap<0?'bad':'good'}">${money(gap)}</div><div class="statfoot">${gap<0?'Дутагдал':'Чөлөөт нөөц'}</div></div></div>
 <div class="notice ${gap>=0?'goodbox':'warnbox'}">${gap>=0?`Зээлээ хассан ${money(avail)}-аас бүх төлөвлөсөн зардлаа гаргавал <b>${money(gap)}</b> үлдэнэ.`:`Бүх төлөвлөсөн зардлыг авбал <b>${money(-gap)}</b> дутна. Доорх ⏸ тэмдэгтэй зүйлсийг хойшлуулбал хүрнэ.`} Зээл хадгаламжаас төлөгдөх тул ${money(avail)}-ийг зээлийн дарамтгүй хэрэглэж болно.</div>
 ${unpl>0?`<div class="notice warnbox click" onclick="drill('unpl')"><b>Төлөвлөөгүй зарлага ${money(unpl)}</b> гарсан байна (дарж харах). Энэ нь төлөвлөсөн зардалд зориулсан мөнгийг бууруулсан.</div>`:''}
 ${rows.length?rows.map(o=>`<div class="plrow"><div class="itemicon">${o.ok?'✔':'⏸'}</div><div class="itembody"><b>${esc(o.x.name)} ${o.x.prio==='can'?statusTag('хойшлуулж болно','amber'):''}</b><small>${o.ok?'Гаргаж болно · дараа нь '+money(o.left)+' үлдэнэ':'Мөнгө хүрэхгүй — хойшлуулахыг зөвлөе'} · ${fmtDate(o.x.date)} · төсөв ${money(o.x.amount)}</small></div><div class="amount ${o.ok?'':'bad'}">${money(o.r)}</div><button class="btn" onclick="markDone('${o.x.id}')">Авсан</button><button class="btn" onclick="edit('budgets','${o.x.id}')">Засах</button></div>`).join(''):'<div class="empty">Биелээгүй төлөвлөсөн зардал алга.</div>'}</div>`}
function dli(t,s,a,cls,oc){return `<div class="lineitem${oc?' click':''}" ${oc?`onclick="${oc}"`:''}><div class="itembody"><b>${t}</b><small>${s||''}</small></div><div class="amount ${cls||''}">${a}</div></div>`}
function drill(k){let op=opening()||{},from=op.date||today,end=add(today,45),fund=loanFunding(today,end),h='',t='',hd=x=>`<h3 style="margin:16px 0 4px;font-size:12px;letter-spacing:1px;color:#8a87a0">${x}</h3>`,
 exps=S.expenses.filter(x=>x.date>from&&x.date<=today).sort((a,b)=>b.date.localeCompare(a.date)),inc=S.income.filter(x=>x.got&&x.date>from&&x.date<=today),
 ed=x=>`closeModal();edit('expenses','${x.id}')`,ll=l=>dli(esc(l.name),fmtDate(l.date)+' · '+esc(kindName(l.kind))+' · '+(l.payFrom==='savings'?'Хадгаламж':'Гүйлгээний данс'),money(l.amount)),
 plans=S.budgets.filter(x=>x.date<=end&&!isDone(x)&&remOf(x)>0),ptot=plans.reduce((a,x)=>a+remOf(x),0),cur=actualBalance(today)||0,free=cur-fund.checkingNeed-ptot;
 if(k==='open'){t='Эхний үлдэгдэл';h=dli('Нийт эхний үлдэгдэл',fmtDate(op.date),money(op.amount||0))+dli('Хадгаламжийн данс руу шилжүүлсэн','Тусад нь хадгаламжид тооцогдоно','−'+money(op.toSav||0))+dli('Гүйлгээний дансанд үлдсэн','Тооцооллын эхлэл',money((op.amount||0)-(op.toSav||0)),'good')+`<div class="formactions"><button class="btn primary" onclick="closeModal();edit('balance','opening')">Засах</button></div>`}
 else if(k==='chk'){t='Гүйлгээний данс';h=dli('Эхлэл','Эхний үлдэгдэл − хадгаламжид шилжүүлсэн · '+fmtDate(from),money((op.amount||0)-(op.toSav||0)))+(inc.length?hd('ОРСОН ОРЛОГО')+inc.map(x=>dli(esc(x.note||'Орлого'),fmtDate(x.date),'+'+money(x.amt),'good')).join(''):'')+hd('БОДИТ ЗАРЛАГА · '+exps.length+' · '+money(sum(exps,'amount')))+exps.map(x=>dli(esc(x.note||'—')+(x.budgetId?'':' '+statusTag('төлөвлөөгүй','amber')),fmtDate(x.date)+' · '+esc(x.cat||''),'−'+money(x.amount),'',ed(x))).join('')+hd('ҮР ДҮН')+dli('Одоогийн үлдэгдэл','',money(cur),'good')}
 else if(k==='chkloans'){t='Гүйлгээний данснаас төлөх зээл';h=(fund.checking.map(ll).join('')||'<div class="empty">Ирэх 45 хоногт алга.</div>')+dli('Нийлбэр','',money(fund.checkingTotal))+(fund.shortfall?dli('Хадгаламж хүрэхгүй тул нөхөх','',money(fund.shortfall),'bad'):'')}
 else if(k==='savloans'||k==='sav'){t='Хадгаламжийн данс';h=dli('Хадгаламжийн үлдэгдэл','',money(fund.sav))+hd('ХАДГАЛАМЖААС ТӨЛӨХӨӨР СОНГОСОН ЗЭЭЛ')+(fund.fromSavings.map(ll).join('')||'<div class="empty">Алга.</div>')+dli('Нийлбэр','',money(fund.savingsAssigned))+dli('Үлдэх хадгаламж / дутагдал','',money(fund.sav-fund.savingsAssigned),fund.shortfall?'bad':'good')}
 else if(k==='loans'){t='Бүх зээлийн төлөлт · 45 хоног';h=(fund.list.map(ll).join('')||'<div class="empty">Алга.</div>')+dli('Нийт','',money(fund.total))}
 else if(k==='plans'){t='Төлөвлөсөн зардлын үлдэгдэл';h=plans.map(x=>dli(esc(x.name),fmtDate(x.date)+' · төсөв '+money(x.amount)+' · гарсан '+money(sum(S.expenses.filter(e=>e.budgetId===x.id),'amount')),money(remOf(x)),'',`closeModal();edit('budgets','${x.id}')`)).join('')+dli('Нийт','',money(ptot))}
 else if(k==='unpl'){let u=S.expenses.filter(e=>!e.budgetId&&e.date>from).sort((a,b)=>b.date.localeCompare(a.date));t='Төлөвлөөгүй зарлага';h=u.map(x=>dli(esc(x.note||'—'),fmtDate(x.date)+' · '+esc(x.cat||''),'−'+money(x.amount),'',ed(x))).join('')+dli('Нийт','Төлөвлөсөн зардалтай холбохыг хүсвэл мөр дээр дарж засна',money(sum(u,'amount')),'bad')}
 else if(k==='free'){t='Төлөвлөгөөний дараах үлдэгдэл';h=dli('Гүйлгээний данс','Дарж задлах',money(cur),'',"drill('chk')")+dli('Гүйлгээний данснаас төлөх зээл','',money(-fund.checkingTotal),'',"drill('chkloans')")+dli('Хадгаламж хүрэхгүй дүн','',money(-fund.shortfall),'',"drill('savloans')")+dli('Төлөвлөсөн зардлын үлдэгдэл','',money(-ptot),'',"drill('plans')")+dli('Үр дүн','',money(free),free<0?'bad':'good')}
 $('#modalTitle').textContent=t;$('#modalBody').innerHTML=h;$('#modal').classList.add('open')}
function goTab(k){tab=k;render()}
function render(){document.body.className=TOK&&API?'':'noauth';if(!TOK||!API){$('#nav').innerHTML='';$('#app').innerHTML=loginView();return}$('#nav').innerHTML=`<div class="brand"><span class="logo">◈</span><span>FinSet<small style="display:block;font-size:10px;color:#aaa8be;font-weight:600;letter-spacing:1px">PERSONAL FINANCE</small></span></div><div class="navlabel">ҮНДСЭН ЦЭС</div>`+NAV.slice(0,5).map(([k,i,n])=>`<button class="navbtn ${tab===k?'on':''}" onclick="goTab('${k}')"><span class="navicon">${i}</span>${n}</button>`).join('')+`<div class="navlabel">ТУСЛАХ</div>`+NAV.slice(5).map(([k,i,n])=>`<button class="navbtn ${tab===k?'on':''}" onclick="goTab('${k}')"><span class="navicon">${i}</span>${n}</button>`).join('')+`<div class="navfoot"><b>Санхүүгээ хянаарай</b>Эхний үлдэгдэл → бодит гүйлгээ → зээлийн нөөц → чөлөөтэй мөнгө</div>`;let pages={home,plan,loan:loans,exp:expenses,bud:budgets,ai,set:settings};$('#app').innerHTML=(pages[tab]||home)();let m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
// A record with id=opening is the opening balance; id=bal is the manually entered current bank balance.
const oldEdit=edit;edit=function(col,id,kind){if(col==='balance'&&['opening','bal','sav'].includes(id)){let r=(S.balance||[]).find(x=>x.id===id)||{id},isOpening=id==='opening',isSavings=id==='sav';let fields=[['date',isOpening?'Эхний үлдэгдлийн огноо':'Шалгаж буй огноо','date',r.date||today],['amount',isOpening?'Нийт эхний үлдэгдэл (₮)':isSavings?'Хадгаламжийн дансны одоогийн үлдэгдэл (₮)':'Банкны апп дээрх гүйлгээний дансны үлдэгдэл (₮)','number',r.amount??''],['note','Тэмдэглэл','text',r.note||'']];if(isOpening)fields.splice(2,0,['toSav','Үүнээс хадгаламжийн данс руу шилжүүлсэн (₮)','number',r.toSav??0]);showForm(col,r,fields);return}oldEdit(col,id,kind)};
// Keep the requested record IDs stable for the backend.
const originalShowForm=showForm;showForm=function(col,r,fields){originalShowForm(col,r,fields);let f=$('#editForm');if(f&&col==='balance'){f.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.amount=+o.amount||0;if('toSav' in o)o.toSav=+o.toSav||0;save('balance',{...r,...o},r.id||'x'+Date.now())}}};
try{let c=JSON.parse(localStorage.cacheS||'null');if(c&&TOK)S={...S,...c}}catch(e){}
render();load();
